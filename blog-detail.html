<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客详情</title>
    <link rel="icon" href="assets/avatar.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/style-controls.css">
    <link rel="stylesheet" href="css/blog-detail.css">
    <link rel="stylesheet" href="css/blog-detail-question.css">
    <link rel="stylesheet" href="css/blog-detail-toc.css">
    <link rel="stylesheet" href="css/blog-detail-macaron.css">
    <link rel="stylesheet" href="css/butterfly.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/search.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/i18n.js" defer></script>
</head>

<body class="blog-detail-page">
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <a class="nav-avatar" href="about.html" aria-label="profile">
                    <img src="assets/avatar.png" alt="头像">
                </a>
                <a class="nav-brand-link" href="index.html" aria-label="home">
                    <span data-i18n="brand"></span>
                </a>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html"><i class="fas fa-home"></i> <span data-i18n="home"></span></a></li>
                <li><a href="archive.html"><i class="fas fa-archive"></i> <span data-i18n="archive"></span></a></li>
                <li><a href="categories.html"><i class="fas fa-tags"></i> <span data-i18n="categories"></span></a></li>
                <li><a href="series.html"><i class="fas fa-layer-group"></i> <span data-i18n="series"></span></a></li>
                <li><a href="quick-links.html"><i class="fas fa-link"></i> <span data-i18n="quicklinks"></span></a></li>
            </ul>
            <div class="nav-actions">
                <button class="nav-search-btn" aria-label="search"><i class="fas fa-search"></i> <span
                        data-i18n="search"></span></button>
                <div class="nav-toggle">
                    <i class="fas fa-bars"></i>
                </div>
            </div>
        </div>
    </nav>

    <main class="blog-detail">
        <div class="container" style="display: flex; gap: 32px;">
            <nav class="blog-toc" id="blog-toc">
                <div class="toc-title" data-i18n="toc"></div>
                <div class="toc-progress" id="toc-progress" aria-live="polite">0</div>
                <ul class="toc-list" id="toc-list"></ul>
                <div id="post-nav-left" class="post-nav-left" aria-hidden="false">
                    <a id="post-prev" class="post-nav-btn" data-type="prev" href="#" style="display:none;"
                        role="button">
                        <div class="post-nav-label" data-i18n="prev_post"></div>
                        <div class="post-nav-title"></div>
                    </a>
                    <a id="post-next" class="post-nav-btn" data-type="next" href="#" style="display:none;"
                        role="button">
                        <div class="post-nav-label" data-i18n="next_post"></div>
                        <div class="post-nav-title"></div>
                    </a>
                    <a id="post-similar" class="post-nav-btn" data-type="similar" href="#" style="display:none;"
                        role="button">
                        <div class="post-nav-label" data-i18n="similar_post"></div>
                        <div class="post-nav-title"></div>
                    </a>
                </div>
            </nav>
            <article class="blog-article" style="flex:1;">
                <header class="article-header">
                    <h1 class="article-title" id="article-title"></h1>
                    <div class="article-meta">
                        <span class="date" id="article-date" data-date=""><i class="far fa-calendar"></i></span>
                        <span class="date" id="article-last-edited" data-date="" style="display:none;"><i
                                class="fas fa-pencil-alt"></i></span>
                        <div class="article-metrics" id="article-metrics" aria-live="polite"></div>
                        <div class="tags" id="article-tags"></div>
                    </div>
                </header>

                <div class="article-content" id="markdown-content"></div>

                <section class="license-notice" aria-label="版权许可声明">
                    <p>
                        本博客所有文章除特别声明外，均采用
                        <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank"
                            rel="noopener noreferrer">CC BY-NC-SA 4.0 许可协议</a>。
                        转载请注明来源BeYoung~
                    </p>
                    <p class="license-blog-link-line">
                        <span class="license-label">博客链接</span>
                        <a id="article-permalink" href="#" target="_blank" rel="noopener noreferrer"></a>
                    </p>
                </section>

                <footer class="article-footer"></footer>
            </article>
        </div>

        <div id="floating-controls">
            <button id="wide-read-btn" class="floating-btn sub-btn" data-i18n-title="immersive_read" aria-hidden="true"
                style="display:none;"><i class="fas fa-expand"></i></button>
            <button id="export-md-btn" class="floating-btn sub-btn" data-i18n-title="export_action" aria-hidden="true"
                style="display:none;"><i class="fas fa-download"></i></button>
            <button id="display-manage-btn" class="floating-btn sub-btn" data-i18n-title="display_manage"
                aria-hidden="true" style="display:none;"><i class="fas fa-eye"></i></button>
            <button id="return-from-ref-btn" class="floating-btn sub-btn" data-i18n-title="back_to_previous"
                aria-hidden="true" style="display:none;">
                <svg class="return-from-ref-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M10 7L5 12l5 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
                        stroke-linejoin="round"></path>
                    <path d="M6 12h8.5a4.5 4.5 0 1 1 0 9H13" fill="none" stroke="currentColor" stroke-width="2.4"
                        stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
            </button>
            <button id="settings-btn" class="floating-btn control-btn" data-i18n-title="settings" aria-haspopup="true"
                aria-expanded="false"><i class="fas fa-cog"></i></button>
            <button id="back-to-top" class="floating-btn" data-i18n-title="back_to_top"><i
                    class="fas fa-arrow-up"></i></button>
        </div>

        <div id="exportModal" class="settings-modal export-modal" aria-hidden="true">
            <div class="settings-modal-card export-modal-card" role="dialog" aria-modal="true"
                aria-labelledby="export-modal-title">
                <button id="exportModalClose" class="settings-modal-close export-modal-close" aria-label="关闭导出弹窗">
                    <i class="fas fa-times" aria-hidden="true"></i>
                </button>
                <div class="settings-modal-content export-modal-content">
                    <section class="settings-section active export-section" id="export-section">
                        <h3 id="export-modal-title" data-i18n="export_modal_title">导出选项</h3>
                        <div class="export-option-group">
                            <p class="export-option-label" data-i18n="export_method_label">导出方式</p>
                            <div class="export-option-list" role="radiogroup" aria-label="导出方式">
                                <label class="export-option-item">
                                    <input type="radio" name="export-method" value="download" checked>
                                    <i class="fas fa-download" aria-hidden="true"></i>
                                    <span data-i18n="export_method_download">下载文件</span>
                                </label>
                                <label class="export-option-item">
                                    <input type="radio" name="export-method" value="copy">
                                    <i class="fas fa-copy" aria-hidden="true"></i>
                                    <span data-i18n="export_method_copy">复制到剪贴板</span>
                                </label>
                            </div>
                        </div>
                        <div class="export-option-group">
                            <p class="export-option-label" data-i18n="export_exercise_label">例题导出方式</p>
                            <div class="export-option-list" role="radiogroup" aria-label="例题导出方式">
                                <label class="export-option-item">
                                    <input type="radio" name="exercise-mode" value="exclude">
                                    <span data-i18n="export_exercise_exclude">不导出例题</span>
                                </label>
                                <label class="export-option-item">
                                    <input type="radio" name="exercise-mode" value="normal" checked>
                                    <span data-i18n="export_exercise_normal">普通导出（当前模式）</span>
                                </label>
                                <label class="export-option-item">
                                    <input type="radio" name="exercise-mode" value="source">
                                    <span data-i18n="export_exercise_source">保持源码导出</span>
                                </label>
                            </div>
                        </div>
                        <div class="export-actions">
                            <button id="exportModalConfirm" class="music-btn export-confirm-btn" type="button">
                                <i class="fas fa-file-export" aria-hidden="true"></i>
                                <span data-i18n="export_confirm">执行导出</span>
                            </button>
                        </div>
                    </section>
                </div>
            </div>
        </div>

        <div id="displayModal" class="settings-modal display-modal" aria-hidden="true">
            <div class="settings-modal-card display-modal-card" role="dialog" aria-modal="true"
                aria-labelledby="display-modal-title">
                <button id="displayModalClose" class="settings-modal-close display-modal-close" aria-label="关闭显示管理弹窗">
                    <i class="fas fa-times" aria-hidden="true"></i>
                </button>
                <div class="settings-modal-content display-modal-content">
                    <section class="settings-section active display-section" id="display-section">
                        <h3 id="display-modal-title" data-i18n="display_modal_title">显示管理</h3>
                        <div class="display-option-group">
                            <p class="display-option-label" data-i18n="display_exercise_label">例题显示</p>
                            <div class="display-option-list" role="radiogroup" aria-label="例题显示">
                                <label class="display-option-item">
                                    <input type="radio" name="display-exercise" value="hide">
                                    <span data-i18n="display_exercise_hide">不显示</span>
                                </label>
                                <label class="display-option-item">
                                    <input type="radio" name="display-exercise" value="collapse" checked>
                                    <span data-i18n="display_exercise_collapse">全部收起答案</span>
                                </label>
                                <label class="display-option-item">
                                    <input type="radio" name="display-exercise" value="practice">
                                    <span data-i18n="display_exercise_practice">练习模式</span>
                                </label>
                                <label class="display-option-item">
                                    <input type="radio" name="display-exercise" value="expand">
                                    <span data-i18n="display_exercise_expand">全部展开答案</span>
                                </label>
                            </div>
                        </div>
                        <div class="display-option-group">
                            <p class="display-option-label" data-i18n="display_code_label">代码块显示</p>
                            <div class="display-option-list" role="radiogroup" aria-label="代码块显示">
                                <label class="display-option-item">
                                    <input type="radio" name="display-code" value="collapse">
                                    <span data-i18n="display_code_collapse">全部收起</span>
                                </label>
                                <label class="display-option-item">
                                    <input type="radio" name="display-code" value="expand" checked>
                                    <span data-i18n="display_code_expand">全部展开</span>
                                </label>
                            </div>
                        </div>
                        <div class="display-actions">
                            <button id="displayModalConfirm" class="music-btn display-confirm-btn" type="button">
                                <i class="fas fa-check" aria-hidden="true"></i>
                                <span data-i18n="display_apply">应用设置</span>
                            </button>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
    <script src="js/markdown.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/search.js"></script>
    <script src="js/blog-detail.js"></script>
</body>

</html>
