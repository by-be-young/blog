<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人博客 | 首页</title>
    <link rel="icon" href="assets/avatar.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/butterfly.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/search.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <!-- KaTeX JS -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script src="js/i18n.js" defer></script>
</head>

<body class="home">
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand" data-i18n="brand"></div>
            <ul class="nav-menu">
                <li><a href="index.html" class="active"><i class="fas fa-home"></i> <span data-i18n="home"></span></a>
                </li>
                <li><a href="archive.html"><i class="fas fa-archive"></i> <span data-i18n="archive"></span></a></li>
                <li><a href="categories.html"><i class="fas fa-tags"></i> <span data-i18n="categories"></span></a></li>
                <li><a href="quick-links.html"><i class="fas fa-link"></i> <span data-i18n="quicklinks"></span></a></li>
            </ul>
            <button class="nav-search-btn" aria-label="search"><i class="fas fa-search"></i> <span
                    data-i18n="search"></span></button>
            <div class="nav-toggle">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </nav>

    <!-- 主页面 -->
    <main>
        <!-- 顶部背景（固定为第二张图） -->
        <section class="hero-section">
            <div class="slideshow" aria-hidden="true">
                <div class="slide active" style="background-image: url('assets/images/bg2.png');"></div>
            </div>
            <div class="hero-content">
                <h1 class="welcome-text" data-i18n="welcome_text"></h1>
                <p class="subtitle">❤️ <span data-i18n="beihang"></span> ❤️</p>
            </div>
            <div class="scroll-down">
                <i class="fas fa-chevron-down bounce"></i>
            </div>
        </section>

        <!-- 博客内容区 -->
        <section class="content-section">
            <div class="container">
                <div class="content-wrapper">
                    <!-- 左侧个人信息卡片 -->
                    <aside class="sidebar" id="sidebar">
                        <div class="profile-card" id="home-profile-card">
                            <div class="avatar">
                                <img src="assets/avatar.png" alt="头像">
                            </div>
                            <h2 class="name" data-i18n="profile_name"></h2>

                            <div class="profile-info">
                                <div class="profile-row">
                                    <span class="profile-label profile-label--school" data-i18n="label_school"></span>
                                    <span class="profile-value" data-i18n="school_name"></span>
                                </div>
                                <div class="profile-row">
                                    <span class="profile-label profile-label--degree" data-i18n="label_degree"></span>
                                    <span class="profile-value" data-i18n="degree_name"></span>
                                </div>
                                <div class="profile-row">
                                    <span class="profile-label profile-label--grade" data-i18n="label_grade"></span>
                                    <span class="profile-value" data-i18n="grade_value"></span>
                                </div>
                                <div class="profile-row">
                                    <span class="profile-label profile-label--department"
                                        data-i18n="label_department"></span>
                                    <span class="profile-value" data-i18n="department_value"></span>
                                </div>
                            </div>

                            <div class="profile-interests">
                                <div class="interests-label" data-i18n="label_interests"></div>
                                <div class="interests-list">
                                    <span class="interest" data-i18n="interest_game"></span>
                                    <span class="interest" data-i18n="interest_literature"></span>
                                    <span class="interest" data-i18n="interest_jpop"></span>
                                    <span class="interest" data-i18n="interest_language"></span>
                                </div>
                            </div>

                            <div class="stats">
                                <div class="stat">
                                    <a class="stat-link" href="archive.html">
                                        <span class="count" id="article-count">0</span>
                                        <span class="label" data-i18n="posts"></span>
                                    </a>
                                </div>
                                <div class="stat">
                                    <a class="stat-link" href="categories.html">
                                        <span class="count" id="tag-count">0</span>
                                        <span class="label" data-i18n="tags"></span>
                                    </a>
                                </div>
                            </div>

                            <div class="social-links contact-links">
                                <a href="#" id="github-link" class="contact-btn" aria-label="GitHub"><i
                                        class="fab fa-github"></i><span class="sr-only"
                                        data-i18n="contact_github"></span></a>
                                <button class="contact-btn" id="wechat-btn" aria-label="WeChat"><i
                                        class="fab fa-weixin"></i><span class="sr-only"
                                        data-i18n="contact_wechat"></span></button>
                                <button class="contact-btn" id="qq-btn" aria-label="QQ"><i class="fab fa-qq"></i><span
                                        class="sr-only" data-i18n="contact_qq"></span></button>
                                <div class="contact-popup" id="contact-popup">
                                    <div class="contact-item"><strong data-i18n="contact_wechat">WeChat</strong>: <span
                                            id="contact-wechat" style="display:none">w19979258352</span></div>
                                    <div class="contact-item"><strong data-i18n="contact_qq">QQ</strong>: <span
                                            id="contact-qq" style="display:none">3416637855</span></div>
                                </div>
                            </div>
                        </div>
                    </aside>

                    <!-- 右侧博客列表 -->
                    <div class="main-content">
                        <div class="blog-grid" id="blogGrid">
                            <!-- 博客卡片将通过JS动态生成 -->
                        </div>
                        <div class="view-more-wrap" id="viewMoreWrap" style="text-align:center; margin: 24px 0;">
                            <button class="view-more-btn" id="viewMoreBtn" data-i18n="view_more">查看更多</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="js/search.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
