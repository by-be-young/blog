<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>归档 | Be Young's Blog</title>
    <link rel="icon" href="assets/avatar.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/butterfly.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/archive.css">
    <link rel="stylesheet" href="css/search.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="js/i18n.js" defer></script>
    <script src="js/formatDate.js" defer></script>
</head>

<body class="archive-page">
    <div class="slideshow" aria-hidden="true">
        <div class="slide active" style="background-image: url('assets/images/bg2.png');"></div>
    </div>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <a class="nav-avatar" href="about.html" aria-label="profile">
                    <img src="assets/avatar.png" alt="头像">
                </a>
                <span data-i18n="brand"></span>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html"><i class="fas fa-home"></i> <span data-i18n="home"></span></a></li>
                <li><a href="archive.html" class="active"><i class="fas fa-archive"></i> <span
                            data-i18n="archive"></span></a></li>
                <li><a href="categories.html"><i class="fas fa-tags"></i> <span data-i18n="categories"></span></a></li>
                <li><a href="quick-links.html"><i class="fas fa-link"></i> <span data-i18n="quicklinks"></span></a></li>
            </ul>
            <div class="nav-actions">
                <button class="nav-search-btn" aria-label="search"><i class="fas fa-search"></i> <span
                        data-i18n="search"></span></button>
                <div class="nav-toggle">
                    <i class="fas fa-bars"></i>
                </div>
            </div>
        </div>
    </nav>
    <main>
        <section class="archive-section">
            <div class="archive-layout">
                <div class="archive-main">
                    <div class="archive-timeline" id="archiveTimeline">
                        <!-- 时间轴内容由JS动态生成 -->
                    </div>
                </div>

                <aside class="archive-sidebar" aria-label="归档日历">
                    <div class="calendar-card" id="calendarCard">
                        <div class="calendar-top">
                            <div class="calendar-top-row">
                                <div class="calendar-view-toggle" role="tablist" aria-label="日历视图">
                                    <button class="calendar-toggle-btn active" type="button" data-view="month"
                                        role="tab" aria-selected="true" data-i18n="view_month"></button>
                                    <button class="calendar-toggle-btn" type="button" data-view="year" role="tab"
                                        aria-selected="false" data-i18n="view_year"></button>
                                </div>
                                <button class="calendar-today-btn" type="button" id="calToday"
                                    aria-label="locate-today">
                                    <i class="fas fa-location-crosshairs"></i>
                                    <span data-i18n="locate_today"></span>
                                </button>
                            </div>
                        </div>

                        <div class="calendar-nav">
                            <button class="calendar-nav-btn" type="button" id="calPrev" aria-label="上一段">
                                <i class="fas fa-chevron-left"></i>
                            </button>
                            <div class="calendar-nav-label" id="calLabel"></div>
                            <button class="calendar-nav-btn" type="button" id="calNext" aria-label="下一段">
                                <i class="fas fa-chevron-right"></i>
                            </button>
                        </div>

                        <div class="calendar-body" id="calendarBody"></div>
                    </div>
                </aside>
            </div>
        </section>
    </main>
    <script src="js/search.js"></script>
    <script src="js/archive.js"></script>
    <script src="js/main.js"></script>
    <!-- Calendar floating action button + modal for small screens -->
    <button id="calendarFab" class="calendar-fab" aria-label="打开日历" aria-hidden="true">
        <i class="fas fa-calendar-alt" aria-hidden="true"></i>
    </button>
    <div id="calendarModal" class="calendar-modal" aria-hidden="true">
        <div class="calendar-modal-backdrop" data-role="backdrop"></div>
        <div class="calendar-modal-inner" role="dialog" aria-modal="true">
            <button class="calendar-modal-close" aria-label="关闭日历"><i class="fas fa-times"></i></button>
            <div class="calendar-modal-body"></div>
        </div>
    </div>
</body>

</html>
