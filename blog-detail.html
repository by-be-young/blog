<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客详情</title>
    <link rel="icon" href="assets/avatar.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/blog-detail.css">
    <link rel="stylesheet" href="css/butterfly.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/search.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github.min.css">

    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/i18n.js" defer></script>
</head>

<body class="blog-detail-page">
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <a class="nav-avatar" href="about.html" aria-label="profile">
                    <img src="assets/avatar.png" alt="头像">
                </a>
                <span data-i18n="brand"></span>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html"><i class="fas fa-home"></i> <span data-i18n="home"></span></a></li>
                <li><a href="archive.html"><i class="fas fa-archive"></i> <span data-i18n="archive"></span></a></li>
                <li><a href="categories.html"><i class="fas fa-tags"></i> <span data-i18n="categories"></span></a></li>
                <li><a href="quick-links.html"><i class="fas fa-link"></i> <span data-i18n="quicklinks"></span></a></li>
            </ul>
            <div class="nav-actions">
                <button class="nav-search-btn" aria-label="search"><i class="fas fa-search"></i> <span
                        data-i18n="search"></span></button>
                <div class="nav-toggle">
                    <i class="fas fa-bars"></i>
                </div>
            </div>
        </div>
        <!-- 文章导航位置已移动至目录下方 -->
    </nav>

    <main class="blog-detail">
        <div class="container" style="display: flex; gap: 32px;">
            <!-- 固定目录 -->
            <nav class="blog-toc" id="blog-toc">
                <div class="toc-title" data-i18n="toc"></div>
                <div class="toc-progress" id="toc-progress" aria-live="polite">0</div>
                <ul class="toc-list" id="toc-list">
                    <!-- JS自动生成目录 -->
                </ul>
                <!-- 插入文章导航（上一篇/下一篇/相似博客），显示在目录下方 -->
                <div id="post-nav-left" class="post-nav-left" aria-hidden="false">
                    <a id="post-prev" class="post-nav-btn" data-type="prev" href="#" style="display:none;"
                        role="button">
                        <div class="post-nav-label" data-i18n="prev_post"></div>
                        <div class="post-nav-title"></div>
                    </a>
                    <a id="post-next" class="post-nav-btn" data-type="next" href="#" style="display:none;"
                        role="button">
                        <div class="post-nav-label" data-i18n="next_post"></div>
                        <div class="post-nav-title"></div>
                    </a>
                    <a id="post-similar" class="post-nav-btn" data-type="similar" href="#" style="display:none;"
                        role="button">
                        <div class="post-nav-label" data-i18n="similar_post"></div>
                        <div class="post-nav-title"></div>
                    </a>
                </div>
            </nav>
            <article class="blog-article" style="flex:1;">
                <header class="article-header">
                    <h1 class="article-title" id="article-title"></h1>
                    <div class="article-meta">
                        <span class="date" id="article-date" data-date=""><i class="far fa-calendar"></i></span>
                        <div class="article-metrics" id="article-metrics" aria-live="polite"></div>
                        <div class="tags" id="article-tags"></div>
                    </div>
                </header>

                <div class="article-content" id="markdown-content">
                    <!-- Markdown内容将通过JS渲染 -->
                </div>

                <section class="license-notice" aria-label="版权许可声明">
                    <p>
                        本博客所有文章除特别声明外，均采用
                        <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank"
                            rel="noopener noreferrer">CC BY-NC-SA 4.0 许可协议</a>。
                        转载请注明来源BeYoung~
                    </p>
                </section>

                <footer class="article-footer">
                    <!-- 分享按钮已移除 -->
                </footer>
            </article>
        </div>
        <!-- 设置与返回顶部容器（固定右下） -->
        <div id="floating-controls">
            <!-- 顺序从上到下：宽屏、导出、设置、回到顶部 -->
            <button id="wide-read-btn" class="floating-btn sub-btn" data-i18n-title="immersive_read" aria-hidden="true"
                style="display:none;"><i class="fas fa-expand"></i></button>
            <button id="export-md-btn" class="floating-btn sub-btn" data-i18n-title="export_markdown" aria-hidden="true"
                style="display:none;"><i class="fas fa-download"></i></button>
            <button id="copy-md-btn" class="floating-btn sub-btn" data-i18n-title="copy_markdown" aria-hidden="true"
                style="display:none;"><i class="fas fa-copy"></i></button>
            <button id="settings-btn" class="floating-btn control-btn" data-i18n-title="settings" aria-haspopup="true"
                aria-expanded="false"><i class="fas fa-cog"></i></button>
            <!-- 返回顶部按钮（仅图标，文字通过 tooltip 显示） -->
            <button id="back-to-top" class="floating-btn" data-i18n-title="back_to_top"><i
                    class="fas fa-arrow-up"></i></button>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <script src="js/markdown.js"></script>
    <!-- KaTeX JS -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/search.js"></script>
    <script>
        // 目录生成
        // 生成可折叠嵌套目录
        function generateTOC() {
            const tocProgressEl = document.getElementById('toc-progress');
            const articleContentEl = document.getElementById('markdown-content');

            function updateTocProgress() {
                if (!tocProgressEl || !articleContentEl) return;
                const rect = articleContentEl.getBoundingClientRect();
                const viewportBottom = window.innerHeight || document.documentElement.clientHeight || 0;
                const total = Math.max(rect.height, 1);
                const passed = viewportBottom - rect.top;
                const ratio = Math.max(0, Math.min(1, passed / total));
                tocProgressEl.textContent = String(Math.round(ratio * 100));
            }

            let activeH1Id = null;
            let lastUrlH1Id = null;

            function openH1ById(h1Id) {
                if (!h1Id || !h1Map.has(h1Id)) return;
                if (activeH1Id === h1Id) return;

                // 收起所有 h1 下的子列表（若存在）并将所有 h1 的 toggle 设为收起状态 ▶
                document.querySelectorAll('.toc-h1 > .toc-sub-list').forEach(ul => {
                    ul.style.display = 'none';
                });
                document.querySelectorAll('.toc-h1 > .toc-toggle').forEach(t => { t.textContent = '▶'; });

                const h1Li = h1Map.get(h1Id);
                if (!h1Li) { activeH1Id = h1Id; return; }
                const ul = h1Li.querySelector('ul');
                const toggle = h1Li.querySelector('.toc-toggle');
                // 若存在子列表则展开；不管是否存在子列表，都把 toggle 置为展开状态 ▼
                if (ul) ul.style.display = 'block';
                if (toggle) toggle.textContent = '▼';

                activeH1Id = h1Id;
            }

            // 目录点击平滑滚动并自动展开
            function scrollToHeaderAndExpand(e, headerId) {
                e.preventDefault();
                const header = document.getElementById(headerId);
                if (header) {
                    // 展开对应h1（不再滚动到h1，只展开）
                    let h1Id = null;
                    if (header.tagName.toLowerCase() === 'h1') {
                        h1Id = header.id;
                    } else if (header.tagName.toLowerCase() === 'h2' || header.tagName.toLowerCase() === 'h3') {
                        // 找到最近的上一个h1
                        let prev = header.previousElementSibling;
                        while (prev) {
                            if (prev.tagName && prev.tagName.toLowerCase() === 'h1') {
                                h1Id = prev.id;
                                break;
                            }
                            prev = prev.previousElementSibling;
                        }
                    }
                    openH1ById(h1Id);
                    // 平滑滚动到header本身，考虑顶部导航栏高度，避免锚点跳转副作用
                    const nav = document.querySelector('.navbar');
                    const navHeight = nav ? nav.offsetHeight : 0;
                    // 先取消锚点跳转
                    if (window.__scrollingToTOC) return; // 防止递归
                    window.__scrollingToTOC = true;
                    // 取消hash跳转副作用
                    const y = header.getBoundingClientRect().top + window.scrollY - navHeight - 10;
                    window.scrollTo({ top: y, behavior: 'smooth' });
                    setTimeout(() => { window.__scrollingToTOC = false; }, 400);

                    // 更新URL hash但不触发浏览器锚点跳转
                    try {
                        history.replaceState(null, '', '#' + headerId);
                    } catch (e) {
                        // ignore
                    }
                }
            }
            const content = document.getElementById('markdown-content');
            const tocList = document.getElementById('toc-list');
            if (!content || !tocList) return;
            tocList.innerHTML = '';
            const headers = Array.from(content.querySelectorAll('h1, h2'));
            let lastH1 = null, lastH2 = null;
            const h1Map = new Map();
            const h2Map = new Map();
            headers.forEach((header, idx) => {
                if (!header.id) header.id = 'toc-h-' + idx;
                const tag = header.tagName.toLowerCase();
                if (tag === 'h1') {
                    lastH1 = document.createElement('li');
                    lastH1.className = 'toc-h1';
                    lastH1.innerHTML = `<span class=\"toc-toggle\" title=\"展开/收起\">▶</span><a href=\"#${header.id}\">${header.textContent}</a>`;
                    tocList.appendChild(lastH1);
                    h1Map.set(header.id, lastH1);
                    lastH2 = null;
                    // h1目录点击
                    lastH1.querySelector('a').addEventListener('click', function (e) {
                        scrollToHeaderAndExpand(e, header.id);
                    });
                } else if (tag === 'h2') {
                    if (!lastH1) return;
                    let ul = lastH1.querySelector('ul');
                    if (!ul) {
                        ul = document.createElement('ul');
                        ul.className = 'toc-sub-list';
                        lastH1.appendChild(ul);
                    }
                    lastH2 = document.createElement('li');
                    lastH2.className = 'toc-h2';
                    lastH2.innerHTML = `<a href=\"#${header.id}\">${header.textContent}</a>`;
                    ul.appendChild(lastH2);
                    h2Map.set(header.id, lastH2);
                    // h2目录点击
                    lastH2.querySelector('a').addEventListener('click', function (e) {
                        scrollToHeaderAndExpand(e, header.id);
                    });
                }
            });
            // 默认收起所有h1下的ul
            document.querySelectorAll('.toc-h1 > .toc-sub-list').forEach(ul => {
                ul.style.display = 'none';
            });
            // h1折叠/展开事件
            document.querySelectorAll('.toc-h1 > .toc-toggle').forEach(toggle => {
                toggle.addEventListener('click', function (e) {
                    e.stopPropagation();
                    const ul = this.parentElement.querySelector('ul');
                    if (!ul) return;
                    const isOpen = ul.style.display === 'block';
                    // 收起所有h1
                    document.querySelectorAll('.toc-h1 > .toc-sub-list').forEach(otherUl => {
                        otherUl.style.display = 'none';
                        const t = otherUl.parentElement.querySelector('.toc-toggle');
                        if (t) t.textContent = '▶';
                    });
                    if (!isOpen) {
                        ul.style.display = 'block';
                        this.textContent = '▼';
                    } else {
                        ul.style.display = 'none';
                        this.textContent = '▶';
                    }
                });
            });
            // 自动展开当前锚点所在h1，其他收起
            function openCurrentH1ByHash() {
                if (location.hash) {
                    let target = document.querySelector(location.hash);
                    if (target) {
                        let h1Id = null;
                        if (target.tagName.toLowerCase() === 'h1') {
                            h1Id = target.id;
                        } else if (target.tagName.toLowerCase() === 'h2' || target.tagName.toLowerCase() === 'h3') {
                            // 找到最近的上一个h1
                            let prev = target.previousElementSibling;
                            while (prev) {
                                if (prev.tagName && prev.tagName.toLowerCase() === 'h1') {
                                    h1Id = prev.id;
                                    break;
                                }
                                prev = prev.previousElementSibling;
                            }
                        }
                        openH1ById(h1Id);
                    }
                }
            }
            // 页面滚动时自动展开当前h1
            window.addEventListener('scroll', function () {
                updateTocProgress();
                if (window.__scrollingToTOC) return;

                // 找到当前可视区域的h1
                const h1s = Array.from(content.querySelectorAll('h1'));
                let current = null;

                const nav = document.querySelector('.navbar');
                const offset = (nav ? nav.offsetHeight : 0) + 20;
                for (let i = 0; i < h1s.length; i++) {
                    const rect = h1s[i].getBoundingClientRect();
                    if (rect.top <= offset) {
                        current = h1s[i];
                    } else {
                        break;
                    }
                }

                if (!current || !current.id) return;

                // 仅更新目录展开状态，不触发浏览器锚点跳转
                openH1ById(current.id);

                // 更新当前可视的 h2 高亮（取最后一个 top <= offset 的 h2）
                try {
                    const h2s = Array.from(content.querySelectorAll('h2'));
                    let currentH2 = null;
                    for (let i = 0; i < h2s.length; i++) {
                        const r = h2s[i].getBoundingClientRect();
                        if (r.top <= offset) currentH2 = h2s[i];
                        else break;
                    }
                    // 清除旧的高亮（目录与正文）
                    document.querySelectorAll('.toc-h2.is-active').forEach(el => el.classList.remove('is-active'));
                    content.querySelectorAll('h2.is-toc-active').forEach(h => h.classList.remove('is-toc-active'));
                    if (currentH2 && currentH2.id) {
                        const li = h2Map.get(currentH2.id);
                        if (li) li.classList.add('is-active');
                        currentH2.classList.add('is-toc-active');
                    }
                } catch (e) { }

                // 可选：同步URL，且不会导致页面跳动
                if (lastUrlH1Id !== current.id) {
                    lastUrlH1Id = current.id;
                    try {
                        history.replaceState(null, '', '#' + current.id);
                    } catch (e) {
                        // ignore
                    }
                }
            });
            window.addEventListener('resize', updateTocProgress);
            // hash变化时自动展开
            window.addEventListener('hashchange', function () {
                openCurrentH1ByHash();
                // also update active h2 on hash change and body heading highlight
                try {
                    const target = document.querySelector(location.hash);
                    document.querySelectorAll('.toc-h2.is-active').forEach(el => el.classList.remove('is-active'));
                    content.querySelectorAll('h2.is-toc-active').forEach(h => h.classList.remove('is-toc-active'));
                    if (target && target.tagName.toLowerCase() === 'h2') {
                        const li = h2Map.get(target.id);
                        if (li) li.classList.add('is-active');
                        target.classList.add('is-toc-active');
                    }
                } catch (e) { }
            });
            // 初始展开
            openCurrentH1ByHash();
            // 初始高亮（如果页面有 hash）
            try {
                if (location.hash) {
                    const t = document.querySelector(location.hash);
                    if (t && t.tagName.toLowerCase() === 'h2' && h2Map.has(t.id)) {
                        document.querySelectorAll('.toc-h2.is-active').forEach(el => el.classList.remove('is-active'));
                        content.querySelectorAll('h2.is-toc-active').forEach(h => h.classList.remove('is-toc-active'));
                        h2Map.get(t.id).classList.add('is-active');
                        t.classList.add('is-toc-active');
                    }
                }
            } catch (e) { }

            updateTocProgress();
        }

        // 返回顶部按钮
        function initBackToTop() {
            const btn = document.getElementById('back-to-top');
            if (!btn) return;
            btn.style.display = 'none';
            window.addEventListener('scroll', function () {
                if (window.scrollY > 300) {
                    btn.style.display = 'inline-flex';
                } else {
                    btn.style.display = 'none';
                }
            });
            btn.addEventListener('click', function () {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
            // floating settings initialized after DOMContentLoaded (defined below)
        }
        // 动态加载 markdown 文件内容
        function getQueryParam(name) {
            const url = new URL(window.location.href);
            return url.searchParams.get(name);
        }

        function countArticleCharacters(markdownText) {
            const raw = String(markdownText || '');
            const stripped = raw
                .replace(/```[\s\S]*?```/g, ' ')
                .replace(/`[^`\n]*`/g, ' ')
                .replace(/!\[[^\]]*\]\([^\)]*\)/g, ' ')
                .replace(/\[([^\]]*)\]\([^\)]*\)/g, '$1')
                .replace(/<[^>]+>/g, ' ')
                .replace(/[#>*~\-]/g, ' ')
                .replace(/\s+/g, '');
            return stripped.length;
        }

        function parseBusuanziNumber(value) {
            const txt = String(value || '').trim();
            if (!txt) return NaN;
            const num = Number(txt.replace(/,/g, ''));
            return Number.isFinite(num) ? num : NaN;
        }

        document.addEventListener('DOMContentLoaded', function () {
            const id = getQueryParam('id');
            // 博客数据与 blogs.json 保持一致
            const metricState = {
                wordCount: null,
                pagePv: NaN,
                pageUv: NaN
            };

            function formatMetricInt(num) {
                const n = Number.isFinite(Number(num)) ? Number(num) : 0;
                return n.toLocaleString('zh-CN');
            }

            function renderArticleMetrics() {
                const metricsEl = document.getElementById('article-metrics');
                if (!metricsEl) return;

                const parts = [];
                if (Number.isFinite(metricState.wordCount)) {
                    parts.push('<span class="article-metric-item"><i class="far fa-file-lines" aria-hidden="true"></i><span>' + formatMetricInt(metricState.wordCount) + '</span></span>');
                }

                const canShowViewAndVisitor = Number.isFinite(metricState.pagePv)
                    && Number.isFinite(metricState.pageUv)
                    && metricState.pagePv >= 100
                    && metricState.pageUv >= 100;

                if (canShowViewAndVisitor) {
                    parts.push('<span class="article-metric-item"><i class="far fa-eye" aria-hidden="true"></i><span>' + formatMetricInt(metricState.pagePv) + '</span></span>');
                    parts.push('<span class="article-metric-item"><i class="far fa-user" aria-hidden="true"></i><span>' + formatMetricInt(metricState.pageUv) + '</span></span>');
                }

                metricsEl.innerHTML = parts.join('');
            }

            function watchBusuanziPageStats() {
                let attempts = 0;
                const maxAttempts = 80;
                const timer = setInterval(function () {
                    attempts++;
                    const pvEl = document.getElementById('busuanzi_page_pv');
                    const uvEl = document.getElementById('busuanzi_page_uv');
                    if (pvEl) metricState.pagePv = parseBusuanziNumber(pvEl.textContent);
                    if (uvEl) metricState.pageUv = parseBusuanziNumber(uvEl.textContent);

                    renderArticleMetrics();

                    if ((Number.isFinite(metricState.pagePv) && Number.isFinite(metricState.pageUv)) || attempts >= maxAttempts) {
                        clearInterval(timer);
                    }
                }, 150);
            }

            watchBusuanziPageStats();

            fetch('data/blogs.json')
                .then(res => res.json())
                .then(blogs => {
                    let blog = blogs.find(b => String(b.id) === id);
                    // 若无参数，默认显示第一个
                    if (!blog) blog = blogs[0];
                    if (!blog) return;

                    // 设置标题
                    const titleEl = document.getElementById('article-title');
                    if (titleEl) {
                        titleEl.textContent = blog.title || '';
                        if (blog.type) {
                            const tspan = document.createElement('span');
                            tspan.className = 'blog-type';
                            tspan.textContent = blog.type;
                            titleEl.appendChild(tspan);
                        }
                    }
                    document.title = blog.title || '博客详情';

                    // 设置日期（保留原始 ISO 在 data-date，用全局 formatDate 优先格式化）
                    const dateEl = document.getElementById('article-date');
                    if (dateEl) {
                        if (blog.date) dateEl.setAttribute('data-date', blog.date);
                        const formatted = (typeof window.formatDate === 'function') ? window.formatDate(blog.date) : (blog.date || '');
                        dateEl.innerHTML = '<i class="far fa-calendar"></i> ' + formatted;
                        dateEl.classList.add('date');
                    }

                    // 设置标签
                    const tagsEl = document.getElementById('article-tags');
                    if (tagsEl && Array.isArray(blog.tags)) {
                        // 每个 tag 点击后在新标签打开分类页，并将该 tag 与其上级路径作为 tags 参数传递
                        tagsEl.innerHTML = blog.tags.map((tag, idx) => {
                            const path = blog.tags.slice(0, idx + 1);
                            const href = 'categories.html?tags=' + encodeURIComponent(JSON.stringify(path));
                            return `<a class=\"tag\" href=\"${href}\" target=\"_blank\" rel=\"noopener noreferrer\">${tag}</a>`;
                        }).join('');
                    }

                    // 左下文章导航：上一篇/下一篇/相似博客（按时间顺序）
                    (function renderPostNav() {
                        try {
                            const prevEl = document.getElementById('post-prev');
                            const nextEl = document.getElementById('post-next');
                            const simEl = document.getElementById('post-similar');
                            if (!prevEl || !nextEl || !simEl) return;

                            // 按日期升序排序（旧 -> 新）
                            const sorted = Array.isArray(blogs) ? blogs.slice().sort((a, b) => new Date(a.date) - new Date(b.date)) : [];
                            const curIdx = sorted.findIndex(b => String(b.id) === String(blog.id));
                            if (curIdx === -1) {
                                prevEl.style.display = 'none'; nextEl.style.display = 'none'; simEl.style.display = 'none';
                                return;
                            }

                            const prev = sorted[curIdx - 1];
                            const next = sorted[curIdx + 1];

                            if (prev) {
                                prevEl.href = 'blog-detail.html?id=' + prev.id;
                                prevEl.target = '_blank';
                                prevEl.rel = 'noopener noreferrer';
                                prevEl.querySelector('.post-nav-title').textContent = prev.title || '';
                                prevEl.style.display = 'flex';
                            } else prevEl.style.display = 'none';

                            if (next) {
                                nextEl.href = 'blog-detail.html?id=' + next.id;
                                nextEl.target = '_blank';
                                nextEl.rel = 'noopener noreferrer';
                                nextEl.querySelector('.post-nav-title').textContent = next.title || '';
                                nextEl.style.display = 'flex';
                            } else nextEl.style.display = 'none';

                            // 相似博客优先级：同(领域,科目,主题) -> 同科目不同主题 -> 同领域不同科目
                            function tag(b, i) { return (b.tags && b.tags[i] !== undefined) ? b.tags[i] : null; }
                            const cur0 = tag(blog, 0), cur1 = tag(blog, 1), cur2 = tag(blog, 2);
                            let similar = null;

                            if (cur0 !== null && cur1 !== null && cur2 !== null) {
                                similar = blogs.find(b => String(b.id) !== String(blog.id) && tag(b, 0) === cur0 && tag(b, 1) === cur1 && tag(b, 2) === cur2);
                            }
                            if (!similar && cur1 !== null) {
                                similar = blogs.find(b => String(b.id) !== String(blog.id) && tag(b, 1) === cur1 && tag(b, 2) !== cur2);
                            }
                            if (!similar && cur0 !== null) {
                                similar = blogs.find(b => String(b.id) !== String(blog.id) && tag(b, 0) === cur0 && tag(b, 1) !== cur1);
                            }

                            if (similar) {
                                simEl.href = 'blog-detail.html?id=' + similar.id;
                                simEl.target = '_blank';
                                simEl.rel = 'noopener noreferrer';
                                simEl.querySelector('.post-nav-title').textContent = similar.title || '';
                                simEl.style.display = 'flex';
                            } else {
                                simEl.style.display = 'none';
                            }

                            // 应用语言资源到导航标签
                            try { if (window.siteI18n && typeof siteI18n.applyTo === 'function') siteI18n.applyTo(document.getElementById('post-nav-left')); } catch (e) { }
                        } catch (e) {
                            console.error('post nav render error', e);
                        }
                    })();

                    fetch(blog.contentFile)
                        .then(res => {
                            if (!res.ok) {
                                throw new Error(`Failed to load: ${blog.contentFile} (${res.status})`);
                            }
                            return res.text();
                        })
                        .then(md => {
                            const contentElement = document.getElementById('markdown-content');
                            if (contentElement) {
                                // store raw markdown for export
                                window.__rawMarkdown = md;
                                metricState.wordCount = countArticleCharacters(md);
                                renderArticleMetrics();
                                contentElement.textContent = md;
                                window.__mdSourcePath = blog.contentFile;
                                if (window.renderMarkdownContent) {
                                    window.renderMarkdownContent();
                                }
                                // 渲染后生成目录
                                setTimeout(generateTOC, 0);
                            }
                        })
                        .catch(err => {
                            console.error(err);
                            const contentElement = document.getElementById('markdown-content');
                            if (contentElement) {
                                contentElement.innerHTML = '<p>文章加载失败，请稍后重试。</p>';
                            }
                        });
                });

            initBackToTop();

            // set up floating settings behavior
            function stripFrontMatter(md) {
                if (!md) return md;
                // trim leading spaces
                const s = md.trimStart();
                if (s.startsWith('---')) {
                    const idx = s.indexOf('\n---', 3);
                    if (idx !== -1) return s.slice(idx + 4).replace(/^\n+/, '');
                }
                return md;
            }

            function normalizeExerciseMarkers(md) {
                if (!md) return md;

                // Replace opening markers with readable labels.
                let normalized = md
                    .replace(/\[task\]/gi, '例题：')
                    .replace(/\[answer\]/gi, '答案：')
                    .replace(/\[analysis\]/gi, '解析：');

                // Remove all remaining known custom markers (opening/closing).
                normalized = normalized
                    .replace(/\[(?:\\|\/)?(?:task|answer|analysis|question|options)\]/gi, '');

                return normalized;
            }

            function getExportMarkdownContent() {
                const raw = window.__rawMarkdown || '';
                const clean = stripFrontMatter(raw);
                return normalizeExerciseMarkers(clean);
            }

            function getI18nText(key, fallback) {
                try {
                    const i18n = window.siteI18n;
                    if (!i18n || typeof i18n.getLang !== 'function' || !i18n.translations) return fallback;
                    const lang = i18n.getLang();
                    const map = i18n.translations[lang] || i18n.translations.zh || {};
                    return map[key] || fallback;
                } catch (e) {
                    return fallback;
                }
            }

            function downloadMarkdown() {
                try {
                    const clean = getExportMarkdownContent();
                    const title = (document.getElementById('article-title') || {}).textContent || 'post';
                    const filename = title.replace(/[^a-z0-9\u4e00-\u9fa5_-]/ig, '_') + '.md';
                    const blob = new Blob([clean], { type: 'text/markdown;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    URL.revokeObjectURL(url);
                } catch (e) {
                    console.error('export markdown failed', e);
                }
            }

            async function copyMarkdown() {
                const clean = getExportMarkdownContent();
                if (!clean) return false;
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(clean);
                    return true;
                }

                const ta = document.createElement('textarea');
                ta.value = clean;
                ta.setAttribute('readonly', '');
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                ta.style.pointerEvents = 'none';
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                let copied = false;
                try {
                    copied = document.execCommand('copy');
                } finally {
                    ta.remove();
                }
                return copied;
            }

            function showCopySuccess(btn) {
                if (!btn) return;
                const icon = btn.querySelector('i');
                if (!icon) return;
                const copiedText = getI18nText('code_copied', '已复制');
                const restoreText = getI18nText('copy_markdown', '复制Markdown');
                icon.className = 'fas fa-check';
                btn.setAttribute('data-tooltip', copiedText);
                btn.title = copiedText;
                setTimeout(() => {
                    icon.className = 'fas fa-copy';
                    btn.setAttribute('data-tooltip', restoreText);
                    btn.title = restoreText;
                }, 1200);
            }

            function initFloatingSettings() {
                const settingsBtn = document.getElementById('settings-btn');
                const wideBtn = document.getElementById('wide-read-btn');
                const exportBtn = document.getElementById('export-md-btn');
                const copyBtn = document.getElementById('copy-md-btn');
                const container = document.getElementById('floating-controls');
                const toc = document.getElementById('blog-toc');
                const article = document.querySelector('.blog-article');
                if (!settingsBtn || !wideBtn || !exportBtn || !copyBtn || !container) return;

                // toggle sub buttons visibility by toggling a class on container
                let subVisible = false;
                function showSubs(show) {
                    subVisible = !!show;
                    settingsBtn.setAttribute('aria-expanded', subVisible ? 'true' : 'false');
                    if (subVisible) {
                        wideBtn.style.display = 'inline-flex';
                        exportBtn.style.display = 'inline-flex';
                        copyBtn.style.display = 'inline-flex';
                        wideBtn.setAttribute('aria-hidden', 'false');
                        exportBtn.setAttribute('aria-hidden', 'false');
                        copyBtn.setAttribute('aria-hidden', 'false');
                        // animate in
                        requestAnimationFrame(() => {
                            wideBtn.style.opacity = '1'; wideBtn.style.transform = 'translateX(0)';
                            exportBtn.style.opacity = '1'; exportBtn.style.transform = 'translateX(0)';
                            copyBtn.style.opacity = '1'; copyBtn.style.transform = 'translateX(0)';
                        });
                    } else {
                        // animate out then hide
                        wideBtn.style.opacity = '0'; wideBtn.style.transform = 'translateX(8px)';
                        exportBtn.style.opacity = '0'; exportBtn.style.transform = 'translateX(8px)';
                        copyBtn.style.opacity = '0'; copyBtn.style.transform = 'translateX(8px)';
                        setTimeout(() => {
                            if (!subVisible) {
                                wideBtn.style.display = 'none';
                                exportBtn.style.display = 'none';
                                copyBtn.style.display = 'none';
                                wideBtn.setAttribute('aria-hidden', 'true');
                                exportBtn.setAttribute('aria-hidden', 'true');
                                copyBtn.setAttribute('aria-hidden', 'true');
                            }
                        }, 180);
                    }
                }

                settingsBtn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    showSubs(!subVisible);
                });

                // close subs when clicking outside
                document.addEventListener('click', function (e) {
                    if (!container.contains(e.target)) {
                        showSubs(false);
                    }
                });

                // immersive reading mode
                let immersiveMode = false;
                const immersiveHint = document.createElement('div');
                immersiveHint.id = 'immersive-read-hint';
                immersiveHint.setAttribute('aria-live', 'polite');
                document.body.appendChild(immersiveHint);

                let hintFadeTimer = null;
                let hintHideTimer = null;
                function showImmersiveHint() {
                    if (hintFadeTimer) clearTimeout(hintFadeTimer);
                    if (hintHideTimer) clearTimeout(hintHideTimer);
                    const exitHint = getI18nText('immersive_exit_hint', '按ESC以退出沉浸阅读');
                    const pdfHint = getI18nText('immersive_pdf_hint', '使用快捷键Ctrl+P可以导出PDF');
                    const exitHintHtml = exitHint.replace('ESC', '<strong class="immersive-key">ESC</strong>');
                    const pdfHintHtml = pdfHint.replace('Ctrl+P', '<strong class="immersive-key">Ctrl+P</strong>');
                    immersiveHint.innerHTML = '<span class="immersive-hint-line">' + exitHintHtml + '</span>' +
                        '<span class="immersive-hint-line">' + pdfHintHtml + '</span>';
                    immersiveHint.classList.remove('is-fading');
                    immersiveHint.classList.add('is-visible');
                    hintFadeTimer = setTimeout(() => {
                        immersiveHint.classList.add('is-fading');
                    }, 3300);
                    hintHideTimer = setTimeout(() => {
                        immersiveHint.classList.remove('is-visible');
                        immersiveHint.classList.remove('is-fading');
                    }, 4300);
                }

                function enterImmersiveMode() {
                    const isMobileViewport = window.matchMedia('(max-width: 880px)').matches;
                    immersiveMode = true;
                    if (article) article.classList.add('wide-mode');
                    if (toc) {
                        toc.classList.add('toc-collapsed');
                        // fully hide the TOC element in immersive mode to avoid flicker
                        toc.style.display = 'none';
                    }
                    // close floating sub-buttons before hiding floating controls
                    showSubs(false);
                    // close TOC overlay if currently open
                    try {
                        const tocOverlay = document.getElementById('toc-overlay');
                        const tocFab = document.getElementById('toc-fab');
                        if (tocOverlay) {
                            tocOverlay.classList.remove('is-active');
                            tocOverlay.style.display = 'none';
                        }
                        if (tocFab) tocFab.setAttribute('aria-expanded', 'false');
                    } catch (e) { }
                    try {
                        document.body.classList.add('wide-mode-active');
                        document.body.classList.add('immersive-reading-active');
                        if (isMobileViewport) document.body.classList.add('immersive-mobile-mode');
                        else document.body.classList.remove('immersive-mobile-mode');
                    } catch (e) { }
                    if (!isMobileViewport) {
                        showImmersiveHint();
                    } else {
                        immersiveHint.classList.remove('is-visible');
                        immersiveHint.classList.remove('is-fading');
                    }
                }
                function exitImmersiveMode() {
                    immersiveMode = false;
                    if (article) article.classList.remove('wide-mode');
                    if (toc) {
                        toc.classList.remove('toc-collapsed');
                        // restore TOC display
                        toc.style.display = '';
                        // ensure any overlay styles removed
                        toc.style.position = '';
                        toc.style.left = '';
                        toc.style.top = '';
                        toc.style.zIndex = '';
                        toc.style.width = '';
                        toc.style.boxShadow = '';
                        toc.style.opacity = '';
                    }
                    try {
                        document.body.classList.remove('wide-mode-active');
                        document.body.classList.remove('immersive-reading-active');
                        document.body.classList.remove('immersive-mobile-mode');
                    } catch (e) { }
                    immersiveHint.classList.remove('is-visible');
                    immersiveHint.classList.remove('is-fading');
                }

                wideBtn.addEventListener('click', function (e) {
                    if (!immersiveMode) {
                        enterImmersiveMode();
                    } else {
                        const isMobileViewport = window.matchMedia('(max-width: 880px)').matches;
                        if (!isMobileViewport) showImmersiveHint();
                    }
                });

                document.addEventListener('keydown', function (e) {
                    if (!immersiveMode) return;
                    if (e.key !== 'Escape') return;
                    e.preventDefault();
                    exitImmersiveMode();
                });

                exportBtn.addEventListener('click', function (e) {
                    downloadMarkdown();
                });

                copyBtn.addEventListener('click', async function (e) {
                    try {
                        const ok = await copyMarkdown();
                        if (ok) showCopySuccess(copyBtn);
                    } catch (err) {
                        console.error('copy markdown failed', err);
                    }
                });
            }
            // call now to wire handlers
            initFloatingSettings();

            // 将目录高度设置为与详情页右侧搜索面板一致的高度，
            // 只在载入与窗口尺寸变化时计算一次高度，避免在滚动时改变高度导致抖动。
            function adjustTocHeight() {
                try {
                    const nav = document.querySelector('.navbar');
                    const toc = document.getElementById('blog-toc');
                    if (!toc) return;
                    const top = nav ? nav.offsetHeight : 60;
                    // 记录首次计算时的 toc 顶部（相对于视口），后续以此为参考避免滚动时高度变大
                    if (!toc.dataset.initialViewportTop) {
                        const rect = toc.getBoundingClientRect();
                        toc.dataset.initialViewportTop = String(Math.max(0, Math.round(rect.top)));
                    }
                    const initialTop = Number(toc.dataset.initialViewportTop) || 0;
                    const desiredTop = Math.max(top + 12, initialTop);

                    // 计算可用高度并固定到目录容器，目录整体不随页面滚动调整高度
                    // 限制为视口高度的 60%-75% 区间以避免目录过高
                    const rawHeight = Math.max(120, window.innerHeight - desiredTop - 18);
                    const clamped = Math.max(120, Math.min(rawHeight, Math.round(window.innerHeight * 0.85)));
                    toc.style.height = clamped + 'px';
                    toc.style.overflow = 'hidden';

                    // 让内部的 toc-list 使用滚动填充可用空间
                    const tocList = document.getElementById('toc-list');
                    if (tocList) {
                        const titleEl = toc.querySelector('.toc-title');
                        const postNav = document.getElementById('post-nav-left');
                        const titleH = titleEl ? Math.ceil(titleEl.getBoundingClientRect().height) : 0;
                        const postNavH = postNav ? Math.ceil(postNav.getBoundingClientRect().height) : 0;
                        const paddingGap = 20; // 容器内间距与缓冲
                        const listMax = Math.max(80, clamped - titleH - postNavH - paddingGap);
                        tocList.style.maxHeight = listMax + 'px';
                        tocList.style.overflowY = 'auto';
                        tocList.style.boxSizing = 'border-box';
                    }
                } catch (e) { console.warn('adjustTocHeight failed', e); }
            }

            // 初始调整并在窗口尺寸变化时更新（不在滚动时更新）
            adjustTocHeight();
            window.addEventListener('resize', adjustTocHeight);

            // 使用站点统一的 formatDate（由 main.js 提供），不再定义本地格式化函数
        });
    </script>
    <script src="js/blog-detail.js"></script>
</body>
