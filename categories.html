<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分类 | Be Young's Blog</title>
    <link rel="icon" href="assets/avatar.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/butterfly.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/categories.css">
    <link rel="stylesheet" href="css/search.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="js/i18n.js" defer></script>
    <script src="js/formatDate.js" defer></script>
</head>

<body class="categories-page">
    <div class="slideshow" aria-hidden="true">
        <div class="slide active" style="background-image: url('assets/images/background/bg2.png');"></div>
    </div>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <a class="nav-avatar" href="about.html" aria-label="profile">
                    <img src="assets/avatar.png" alt="头像">
                </a>
                <a class="nav-brand-link" href="index.html" aria-label="home">
                    <span data-i18n="brand"></span>
                </a>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html"><i class="fas fa-home"></i> <span data-i18n="home"></span></a></li>
                <li><a href="archive.html"><i class="fas fa-archive"></i> <span data-i18n="archive"></span></a></li>
                <li><a href="categories.html" class="active"><i class="fas fa-tags"></i> <span
                            data-i18n="categories"></span></a></li>
                <li><a href="series.html"><i class="fas fa-layer-group"></i> <span data-i18n="series"></span></a></li>
                <li><a href="quick-links.html"><i class="fas fa-link"></i> <span data-i18n="quicklinks"></span></a></li>
            </ul>
            <div class="nav-actions">
                <button class="nav-search-btn" aria-label="search"><i class="fas fa-search"></i> <span
                        data-i18n="search"></span></button>
                <div class="nav-toggle">
                    <i class="fas fa-bars"></i>
                </div>
            </div>
        </div>
    </nav>
    <main>
        <section class="categories-section">
            <div class="categories-layout">
                <aside class="categories-sidebar" aria-label="分类筛选">
                    <div class="categories-container" id="categoriesContainer">
                        <!-- 三级滚轮筛选由JS动态生成 -->
                    </div>
                    <div class="archive-filter-panel" id="categoriesTypeFilterPanel" aria-label="博客类型筛选">
                        <div class="archive-filter-toggle" id="categoriesTypeFilterToggle" role="radiogroup"
                            aria-label="博客类型筛选">
                            <button class="archive-filter-btn" type="button" data-filter="learning" role="radio"
                                aria-checked="false" data-i18n="archive_filter_learning"></button>
                            <button class="archive-filter-btn active" type="button" data-filter="all" role="radio"
                                aria-checked="true" data-i18n="archive_filter_all"></button>
                            <button class="archive-filter-btn" type="button" data-filter="non-learning" role="radio"
                                aria-checked="false" data-i18n="archive_filter_non_learning"></button>
                        </div>
                    </div>
                </aside>
                <div class="blog-list" id="blogList">
                    <!-- 分类下的博客列表由JS动态生成 -->
                </div>
            </div>
        </section>
    </main>
    <script src="js/search.js"></script>
    <script src="js/slideshow.js"></script>
    <script src="js/fireflies.js"></script>
    <script src="js/categories.js"></script>
    <script src="js/main.js"></script>

    <!-- Categories filter floating action button + modal for small screens -->
    <button id="categoriesFab" class="categories-filter-fab" aria-label="打开筛选" aria-hidden="true">
        <i class="fas fa-sliders" aria-hidden="true"></i>
    </button>
    <div id="categoriesModal" class="categories-filter-modal" aria-hidden="true">
        <div class="categories-filter-modal-backdrop" data-role="backdrop"></div>
        <div class="categories-filter-modal-inner" role="dialog" aria-modal="true">
            <div class="categories-filter-modal-body"></div>
        </div>
    </div>
</body>

</html>
