<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客详情</title>
    <link rel="icon" href="assets/avatar.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/butterfly.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/search.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/i18n.js" defer></script>
</head>

<body class="blog-detail-page">
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand" data-i18n="brand"></div>
            <ul class="nav-menu">
                <li><a href="index.html"><i class="fas fa-home"></i> <span data-i18n="home"></span></a></li>
                <li><a href="archive.html"><i class="fas fa-archive"></i> <span data-i18n="archive"></span></a></li>
                <li><a href="categories.html"><i class="fas fa-tags"></i> <span data-i18n="categories"></span></a></li>
                <li><a href="quick-links.html"><i class="fas fa-link"></i> <span data-i18n="quicklinks"></span></a></li>
            </ul>
            <button class="nav-search-btn" aria-label="search"><i class="fas fa-search"></i> <span
                    data-i18n="search"></span></button>
            <div class="nav-toggle">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </nav>

    <main class="blog-detail">
        <div class="container" style="display: flex; gap: 32px;">
            <!-- 固定目录 -->
            <nav class="blog-toc" id="blog-toc">
                <div class="toc-title" data-i18n="toc"></div>
                <ul class="toc-list" id="toc-list">
                    <!-- JS自动生成目录 -->
                </ul>
            </nav>
            <article class="blog-article" style="flex:1;">
                <header class="article-header">
                    <h1 class="article-title" id="article-title"></h1>
                    <div class="article-meta">
                        <span class="date" id="article-date" data-date=""><i class="far fa-calendar"></i></span>
                        <div class="tags" id="article-tags"></div>
                    </div>
                </header>

                <div class="article-content" id="markdown-content">
                    <!-- Markdown内容将通过JS渲染 -->
                </div>

                <footer class="article-footer">
                    <!-- 分享按钮已移除 -->
                </footer>
            </article>
        </div>
        <!-- 设置与返回顶部容器（固定右下） -->
        <div id="floating-controls">
            <!-- 顺序从上到下：宽屏、导出、设置、回到顶部 -->
            <button id="wide-read-btn" class="floating-btn sub-btn" data-i18n-title="wide_read" aria-hidden="true"
                style="display:none;"><i class="fas fa-expand"></i></button>
            <button id="export-md-btn" class="floating-btn sub-btn" data-i18n-title="export_markdown" aria-hidden="true"
                style="display:none;"><i class="fas fa-download"></i></button>
            <button id="settings-btn" class="floating-btn control-btn" data-i18n-title="settings" aria-haspopup="true"
                aria-expanded="false"><i class="fas fa-cog"></i></button>
            <!-- 返回顶部按钮（仅图标，文字通过 tooltip 显示） -->
            <button id="back-to-top" class="floating-btn" data-i18n-title="back_to_top"><i
                    class="fas fa-arrow-up"></i></button>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <script src="js/markdown.js"></script>
    <!-- KaTeX JS -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/search.js"></script>
    <script>
        // 目录生成
        // 生成可折叠嵌套目录
        function generateTOC() {
            let activeH1Id = null;
            let lastUrlH1Id = null;

            function openH1ById(h1Id) {
                if (!h1Id || !h1Map.has(h1Id)) return;
                if (activeH1Id === h1Id) return;

                // 收起所有h1
                document.querySelectorAll('.toc-h1 > .toc-sub-list').forEach(ul => {
                    ul.style.display = 'none';
                    const t = ul.parentElement.querySelector('.toc-toggle');
                    if (t) t.textContent = '▶';
                });

                const h1Li = h1Map.get(h1Id);
                const ul = h1Li.querySelector('ul');
                if (ul) {
                    ul.style.display = 'block';
                    const toggle = h1Li.querySelector('.toc-toggle');
                    if (toggle) toggle.textContent = '▼';
                }

                activeH1Id = h1Id;
            }

            // 目录点击平滑滚动并自动展开
            function scrollToHeaderAndExpand(e, headerId) {
                e.preventDefault();
                const header = document.getElementById(headerId);
                if (header) {
                    // 展开对应h1（不再滚动到h1，只展开）
                    let h1Id = null;
                    if (header.tagName.toLowerCase() === 'h1') {
                        h1Id = header.id;
                    } else if (header.tagName.toLowerCase() === 'h2' || header.tagName.toLowerCase() === 'h3') {
                        // 找到最近的上一个h1
                        let prev = header.previousElementSibling;
                        while (prev) {
                            if (prev.tagName && prev.tagName.toLowerCase() === 'h1') {
                                h1Id = prev.id;
                                break;
                            }
                            prev = prev.previousElementSibling;
                        }
                    }
                    openH1ById(h1Id);
                    // 平滑滚动到header本身，考虑顶部导航栏高度，避免锚点跳转副作用
                    const nav = document.querySelector('.navbar');
                    const navHeight = nav ? nav.offsetHeight : 0;
                    // 先取消锚点跳转
                    if (window.__scrollingToTOC) return; // 防止递归
                    window.__scrollingToTOC = true;
                    // 取消hash跳转副作用
                    const y = header.getBoundingClientRect().top + window.scrollY - navHeight - 10;
                    window.scrollTo({ top: y, behavior: 'smooth' });
                    setTimeout(() => { window.__scrollingToTOC = false; }, 400);

                    // 更新URL hash但不触发浏览器锚点跳转
                    try {
                        history.replaceState(null, '', '#' + headerId);
                    } catch (e) {
                        // ignore
                    }
                }
            }
            const content = document.getElementById('markdown-content');
            const tocList = document.getElementById('toc-list');
            if (!content || !tocList) return;
            tocList.innerHTML = '';
            const headers = Array.from(content.querySelectorAll('h1, h2'));
            let lastH1 = null, lastH2 = null;
            const h1Map = new Map();
            headers.forEach((header, idx) => {
                if (!header.id) header.id = 'toc-h-' + idx;
                const tag = header.tagName.toLowerCase();
                if (tag === 'h1') {
                    lastH1 = document.createElement('li');
                    lastH1.className = 'toc-h1';
                    lastH1.innerHTML = `<span class=\"toc-toggle\" title=\"展开/收起\">▶</span><a href=\"#${header.id}\">${header.textContent}</a>`;
                    tocList.appendChild(lastH1);
                    h1Map.set(header.id, lastH1);
                    lastH2 = null;
                    // h1目录点击
                    lastH1.querySelector('a').addEventListener('click', function (e) {
                        scrollToHeaderAndExpand(e, header.id);
                    });
                } else if (tag === 'h2') {
                    if (!lastH1) return;
                    let ul = lastH1.querySelector('ul');
                    if (!ul) {
                        ul = document.createElement('ul');
                        ul.className = 'toc-sub-list';
                        lastH1.appendChild(ul);
                    }
                    lastH2 = document.createElement('li');
                    lastH2.className = 'toc-h2';
                    lastH2.innerHTML = `<a href=\"#${header.id}\">${header.textContent}</a>`;
                    ul.appendChild(lastH2);
                    // h2目录点击
                    lastH2.querySelector('a').addEventListener('click', function (e) {
                        scrollToHeaderAndExpand(e, header.id);
                    });
                }
            });
            // 默认收起所有h1下的ul
            document.querySelectorAll('.toc-h1 > .toc-sub-list').forEach(ul => {
                ul.style.display = 'none';
            });
            // h1折叠/展开事件
            document.querySelectorAll('.toc-h1 > .toc-toggle').forEach(toggle => {
                toggle.addEventListener('click', function (e) {
                    e.stopPropagation();
                    const ul = this.parentElement.querySelector('ul');
                    if (!ul) return;
                    const isOpen = ul.style.display === 'block';
                    // 收起所有h1
                    document.querySelectorAll('.toc-h1 > .toc-sub-list').forEach(otherUl => {
                        otherUl.style.display = 'none';
                        const t = otherUl.parentElement.querySelector('.toc-toggle');
                        if (t) t.textContent = '▶';
                    });
                    if (!isOpen) {
                        ul.style.display = 'block';
                        this.textContent = '▼';
                    } else {
                        ul.style.display = 'none';
                        this.textContent = '▶';
                    }
                });
            });
            // 自动展开当前锚点所在h1，其他收起
            function openCurrentH1ByHash() {
                if (location.hash) {
                    let target = document.querySelector(location.hash);
                    if (target) {
                        let h1Id = null;
                        if (target.tagName.toLowerCase() === 'h1') {
                            h1Id = target.id;
                        } else if (target.tagName.toLowerCase() === 'h2' || target.tagName.toLowerCase() === 'h3') {
                            // 找到最近的上一个h1
                            let prev = target.previousElementSibling;
                            while (prev) {
                                if (prev.tagName && prev.tagName.toLowerCase() === 'h1') {
                                    h1Id = prev.id;
                                    break;
                                }
                                prev = prev.previousElementSibling;
                            }
                        }
                        openH1ById(h1Id);
                    }
                }
            }
            // 页面滚动时自动展开当前h1
            window.addEventListener('scroll', function () {
                if (window.__scrollingToTOC) return;

                // 找到当前可视区域的h1
                const h1s = Array.from(content.querySelectorAll('h1'));
                let current = null;

                const nav = document.querySelector('.navbar');
                const offset = (nav ? nav.offsetHeight : 0) + 20;
                for (let i = 0; i < h1s.length; i++) {
                    const rect = h1s[i].getBoundingClientRect();
                    if (rect.top <= offset) {
                        current = h1s[i];
                    } else {
                        break;
                    }
                }

                if (!current || !current.id) return;

                // 仅更新目录展开状态，不触发浏览器锚点跳转
                openH1ById(current.id);

                // 可选：同步URL，且不会导致页面跳动
                if (lastUrlH1Id !== current.id) {
                    lastUrlH1Id = current.id;
                    try {
                        history.replaceState(null, '', '#' + current.id);
                    } catch (e) {
                        // ignore
                    }
                }
            });
            // hash变化时自动展开
            window.addEventListener('hashchange', openCurrentH1ByHash);
            // 初始展开
            openCurrentH1ByHash();
        }

        // 返回顶部按钮
        function initBackToTop() {
            const btn = document.getElementById('back-to-top');
            if (!btn) return;
            btn.style.display = 'none';
            window.addEventListener('scroll', function () {
                if (window.scrollY > 300) {
                    btn.style.display = 'inline-flex';
                } else {
                    btn.style.display = 'none';
                }
            });
            btn.addEventListener('click', function () {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
            // floating settings initialized after DOMContentLoaded (defined below)
        }
        // 动态加载 markdown 文件内容
        function getQueryParam(name) {
            const url = new URL(window.location.href);
            return url.searchParams.get(name);
        }

        document.addEventListener('DOMContentLoaded', function () {
            const id = getQueryParam('id');
            // 博客数据与 blogs.json 保持一致

            fetch('data/blogs.json')
                .then(res => res.json())
                .then(blogs => {
                    let blog = blogs.find(b => String(b.id) === id);
                    // 若无参数，默认显示第一个
                    if (!blog) blog = blogs[0];
                    if (!blog) return;

                    // 设置标题
                    const titleEl = document.getElementById('article-title');
                    if (titleEl) titleEl.textContent = blog.title || '';

                    // 设置日期（保留原始 ISO 在 data-date，用全局 formatDate 优先格式化）
                    const dateEl = document.getElementById('article-date');
                    if (dateEl) {
                        if (blog.date) dateEl.setAttribute('data-date', blog.date);
                        const formatted = (typeof window.formatDate === 'function') ? window.formatDate(blog.date) : (blog.date || '');
                        dateEl.innerHTML = '<i class="far fa-calendar"></i> ' + formatted;
                        dateEl.classList.add('date');
                    }

                    // 设置标签
                    const tagsEl = document.getElementById('article-tags');
                    if (tagsEl && Array.isArray(blog.tags)) {
                        tagsEl.innerHTML = blog.tags.map(tag => `<span class=\"tag\">${tag}</span>`).join('');
                    }

                    fetch(blog.contentFile)
                        .then(res => {
                            if (!res.ok) {
                                throw new Error(`Failed to load: ${blog.contentFile} (${res.status})`);
                            }
                            return res.text();
                        })
                        .then(md => {
                            const contentElement = document.getElementById('markdown-content');
                            if (contentElement) {
                                // store raw markdown for export
                                window.__rawMarkdown = md;
                                contentElement.textContent = md;
                                window.__mdSourcePath = blog.contentFile;
                                if (window.renderMarkdownContent) {
                                    window.renderMarkdownContent();
                                }
                                // 渲染后生成目录
                                setTimeout(generateTOC, 0);
                            }
                        })
                        .catch(err => {
                            console.error(err);
                            const contentElement = document.getElementById('markdown-content');
                            if (contentElement) {
                                contentElement.innerHTML = '<p>文章加载失败，请稍后重试。</p>';
                            }
                        });
                });

            initBackToTop();

            // set up floating settings behavior
            function stripFrontMatter(md) {
                if (!md) return md;
                // trim leading spaces
                const s = md.trimStart();
                if (s.startsWith('---')) {
                    const idx = s.indexOf('\n---', 3);
                    if (idx !== -1) return s.slice(idx + 4).replace(/^\n+/, '');
                }
                return md;
            }

            function downloadMarkdown() {
                try {
                    const raw = window.__rawMarkdown || '';
                    const clean = stripFrontMatter(raw);
                    const title = (document.getElementById('article-title') || {}).textContent || 'post';
                    const filename = title.replace(/[^a-z0-9\u4e00-\u9fa5_-]/ig, '_') + '.md';
                    const blob = new Blob([clean], { type: 'text/markdown;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    URL.revokeObjectURL(url);
                } catch (e) {
                    console.error('export markdown failed', e);
                }
            }

            function initFloatingSettings() {
                const settingsBtn = document.getElementById('settings-btn');
                const wideBtn = document.getElementById('wide-read-btn');
                const exportBtn = document.getElementById('export-md-btn');
                const container = document.getElementById('floating-controls');
                const toc = document.getElementById('blog-toc');
                const article = document.querySelector('.blog-article');
                if (!settingsBtn || !wideBtn || !exportBtn || !container) return;

                // toggle sub buttons visibility by toggling a class on container
                let subVisible = false;
                function showSubs(show) {
                    subVisible = !!show;
                    settingsBtn.setAttribute('aria-expanded', subVisible ? 'true' : 'false');
                    if (subVisible) {
                        wideBtn.style.display = 'inline-flex';
                        exportBtn.style.display = 'inline-flex';
                        wideBtn.setAttribute('aria-hidden', 'false');
                        exportBtn.setAttribute('aria-hidden', 'false');
                        // animate in
                        requestAnimationFrame(() => {
                            wideBtn.style.opacity = '1'; wideBtn.style.transform = 'translateX(0)';
                            exportBtn.style.opacity = '1'; exportBtn.style.transform = 'translateX(0)';
                        });
                    } else {
                        // animate out then hide
                        wideBtn.style.opacity = '0'; wideBtn.style.transform = 'translateX(8px)';
                        exportBtn.style.opacity = '0'; exportBtn.style.transform = 'translateX(8px)';
                        setTimeout(() => {
                            if (!subVisible) {
                                wideBtn.style.display = 'none';
                                exportBtn.style.display = 'none';
                                wideBtn.setAttribute('aria-hidden', 'true');
                                exportBtn.setAttribute('aria-hidden', 'true');
                            }
                        }, 180);
                    }
                }

                settingsBtn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    showSubs(!subVisible);
                });

                // close subs when clicking outside
                document.addEventListener('click', function (e) {
                    if (!container.contains(e.target)) {
                        showSubs(false);
                    }
                });

                // wide reading toggle
                let wideMode = false;
                function enterWideMode() {
                    wideMode = true;
                    if (article) article.classList.add('wide-mode');
                    if (toc) {
                        toc.classList.add('toc-collapsed');
                        // fully hide the TOC element in wide mode to avoid flicker
                        toc.style.display = 'none';
                    }
                    // debug indicator: mark body and log
                    try { document.body.classList.add('wide-mode-active'); } catch (e) { }
                    try { console.log('wide-mode: enter'); } catch (e) { }
                }
                function exitWideMode() {
                    wideMode = false;
                    if (article) article.classList.remove('wide-mode');
                    if (toc) {
                        toc.classList.remove('toc-collapsed');
                        // restore TOC display
                        toc.style.display = '';
                        // ensure any overlay styles removed
                        toc.style.position = '';
                        toc.style.left = '';
                        toc.style.top = '';
                        toc.style.zIndex = '';
                        toc.style.width = '';
                        toc.style.boxShadow = '';
                        toc.style.opacity = '';
                    }
                    try { document.body.classList.remove('wide-mode-active'); } catch (e) { }
                    try { console.log('wide-mode: exit'); } catch (e) { }
                }

                function tocOverlayShow() {
                    if (!wideMode) return;
                    // show TOC as an overlay on the left side above the article
                    toc.style.position = 'fixed';
                    toc.style.left = '24px';
                    toc.style.top = '120px';
                    toc.style.zIndex = '1002';
                    toc.style.width = '360px';
                    toc.style.boxShadow = '0 20px 48px rgba(0,0,0,0.18)';
                    toc.style.opacity = '1';
                }
                function tocOverlayHide() {
                    if (!wideMode) return;
                    // revert to collapsed (hidden)
                    toc.style.position = '';
                    toc.style.left = '';
                    toc.style.top = '';
                    toc.style.zIndex = '';
                    toc.style.width = '';
                    toc.style.boxShadow = '';
                    toc.style.opacity = '';
                }

                wideBtn.addEventListener('click', function (e) {
                    if (!wideMode) enterWideMode(); else exitWideMode();
                });

                exportBtn.addEventListener('click', function (e) {
                    downloadMarkdown();
                });
            }
            // call now to wire handlers
            initFloatingSettings();

            // 使用站点统一的 formatDate（由 main.js 提供），不再定义本地格式化函数
        });
    </script>
</body>

</html>
