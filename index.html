    <!-- ============================================================
    部署通知脚本：检测到 GitHub Pages 环境时，显示“部署成功”弹窗
    使用 localStorage 记录状态，避免重复弹出
    ============================================================ -->
    <script>
        (function () {
            function runNotice() {
                // 仅在 github.io 域名下生效
                var host = (window.location && window.location.hostname ? window.location.hostname : '').toLowerCase();
                if (!host.includes('github.io')) return;

                // 检查是否已经显示过该通知
                var storageKey = 'homeDeploymentNoticeShown_v1';
                try {
                    if (window.localStorage && window.localStorage.getItem(storageKey) === '1') return;
                } catch (e) { /* 忽略 localStorage 错误 */ }

                // 构建弹窗 DOM
                var modal = document.createElement('div');
                modal.className = 'deployment-notice-modal is-open';
                modal.setAttribute('aria-hidden', 'false');

                var targetUrl = 'http://be-young.top';
                modal.innerHTML = `
                        <div class="deployment-notice-card" role="dialog" aria-modal="true" aria-labelledby="deployment-notice-title">
                            <button class="deployment-notice-close" aria-label="关闭提示">
                                <i class="fas fa-times" aria-hidden="true"></i>
                            </button>
                            <h3 class="deployment-notice-title" id="deployment-notice-title">部署成功</h3>
                            <p class="deployment-notice-text">该博客已经成功部署到服务器！点击链接即可跳转。感谢支持！</p>
                            <a class="deployment-notice-link" href="${targetUrl}">点击这里跳转</a>
                        </div>
                    `;

                // 关闭弹窗并移除 DOM
                function closeNotice() {
                    modal.classList.remove('is-open');
                    modal.setAttribute('aria-hidden', 'true');
                    setTimeout(function () {
                        try {
                            if (modal && modal.parentNode) modal.parentNode.removeChild(modal);
                        } catch (e) { /* 忽略移除错误 */ }
                    }, 120);
                }

                // 点击背景关闭
                modal.addEventListener('click', function (e) {
                    if (e.target === modal) closeNotice();
                });

                // 关闭按钮事件
                try {
                    var closeBtn = modal.querySelector('.deployment-notice-close');
                    if (closeBtn) closeBtn.addEventListener('click', closeNotice);
                } catch (e) { /* 忽略查询错误 */ }

                // 将弹窗添加到页面
                try {
                    if (document.body) document.body.appendChild(modal);
                    else document.addEventListener('DOMContentLoaded', function () { document.body.appendChild(modal); }, { once: true });
                } catch (e) { /* 忽略添加错误 */ }

                // 记录已显示状态，并在页面卸载时清除（允许下次访问重新显示）
                try {
                    if (window.localStorage) {
                        window.localStorage.setItem(storageKey, '1');
                        window.addEventListener('beforeunload', function () {
                            try { window.localStorage.removeItem(storageKey); } catch (e) { /* 忽略 */ }
                        }, { once: true });
                    }
                } catch (e) { /* 忽略存储错误 */ }
            }

            // 等待 DOM 就绪后执行
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', runNotice);
            } else {
                runNotice();
            }
        })();
    </script>

    <!-- ============================================================
    空闲时预取其它页面与公共 CSS（不阻塞首屏性能）
    ============================================================ -->
    <script>
        (function () {
            function idle(cb) {
                if ('requestIdleCallback' in window) return requestIdleCallback(cb, { timeout: 2000 });
                return setTimeout(cb, 2000);
            }

            window.addEventListener('load', function () {
                idle(function () {
                    try {
                        // 预取页面 HTML
                        var pages = ['archive.html', 'categories.html', 'series.html', 'quick-links.html', 'about.html'];
                        pages.forEach(function (p) {
                            var l = document.createElement('link');
                            l.rel = 'prefetch';
                            l.href = p;
                            l.as = 'document';
                            document.head.appendChild(l);
                        });

                        // 预取公共样式
                        var commonCss = ['css/style.css', 'css/butterfly.css'];
                        commonCss.forEach(function (h) {
                            var l = document.createElement('link');
                            l.rel = 'prefetch';
                            l.as = 'style';
                            l.href = h;
                            l.onload = function () { this.rel = 'stylesheet'; };
                            document.head.appendChild(l);
                        });
                    } catch (e) {
                        // 预取失败不影响页面正常功能
                    }
                });
            });
        })();
    </script>
